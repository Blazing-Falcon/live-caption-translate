<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>tilted-card</title>
<style>
  html, body { margin: 0; }
  body { width: 800px; height: 440px; overflow: hidden; background: #e4e9ed; color: #222; font: 28px/1.7 'Microsoft YaHei', sans-serif; }
  article { position: absolute; left: 140px; top: 115px; padding: 24px; background: #fffdf6; transform: rotate(8deg); }
  span { display: block; white-space: nowrap; }
</style>
<body data-size="800x440">
<article data-block="0"><span data-line>清晨的河边总是很安静。</span><span data-line>薄雾贴着水面慢慢散开。</span></article>
</body>
</html>
