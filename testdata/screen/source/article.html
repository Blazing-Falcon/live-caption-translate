  <article>
    <p data-block="0">清晨的河边总是很安静。薄雾贴着水面慢慢散开，岸上的老人在练太极，卖早点的小摊刚刚支起炉子。桥下的水流得很慢，几只白鹭站在浅滩上，一动不动地盯着水里的小鱼。偶尔有自行车从石板路上驶过，铃声清脆，很快又消失在街角。</p>
    <p data-block="1">这条河曾经因为污染而被人遗忘。二十多年前，附近的居民自发组织起来清理河岸，种上柳树和芦苇，后来政府也加入进来，修建了步道和小公园。如今每到周末，孩子们在水边追逐，年轻人带着相机寻找合适的角度，河水重新成为这里最受欢迎的公共空间。人们常说，一座城市是否宜居，看看它的河就知道了。</p>
  </article>
