<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ui-panel</title>
<style>
  html, body { margin: 0; }
  body {
    width: 960px; height: 600px; overflow: hidden; position: relative;
    background: #dfe3e8; color: #1a1a1a;
    font: 14px/1.5 'Microsoft YaHei', sans-serif;
  }
  .menu { position: absolute; left: 0; top: 0; width: 960px; height: 30px; display: flex; background: #f7f7f7; border-bottom: 1px solid #c8c8c8; }
  .menu span { padding: 3px 14px; }
  .tools { position: absolute; left: 0; top: 31px; width: 960px; height: 42px; display: flex; align-items: center; gap: 8px; padding-left: 12px; background: #f0f0f0; border-bottom: 1px solid #c8c8c8; box-sizing: border-box; }
  .tools button { font: 12px/1.5 'Microsoft YaHei', sans-serif; padding: 4px 12px; border: 1px solid #b8b8b8; border-radius: 3px; background: #fdfdfd; color: #1a1a1a; }
  .status { position: absolute; left: 0; top: 575px; width: 960px; height: 25px; display: flex; gap: 40px; padding: 2px 12px; box-sizing: border-box; background: #0b5cad; color: #fff; font-size: 12px; }
  .dialog { position: absolute; left: 190px; top: 100px; width: 580px; height: 440px; background: #fff; border: 1px solid #9a9a9a; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); }
  .title { padding: 10px 18px; font-size: 16px; font-weight: 700; border-bottom: 1px solid #e0e0e0; }
  .tabs { display: flex; gap: 6px; padding: 10px 18px 0; border-bottom: 1px solid #d0d0d0; }
  .tabs span { padding: 5px 16px; border: 1px solid transparent; border-bottom: 0; }
  .tabs .on { border-color: #d0d0d0; background: #fff; margin-bottom: -1px; border-bottom: 1px solid #fff; color: #0b5cad; }
  .row { display: flex; align-items: center; gap: 12px; margin: 0 18px; height: 44px; }
  .row .name { width: 110px; }
  .field { border: 1px solid #8a8a8a; border-radius: 2px; padding: 3px 10px; background: #fff; min-width: 40px; }
  .field.wide { width: 140px; }
  .check { display: flex; align-items: center; gap: 10px; margin: 0 18px; height: 36px; }
  .box { width: 14px; height: 14px; border: 1px solid #5a5a5a; border-radius: 2px; background: #fff; }
  .box.on { background: #0b5cad; border-color: #0b5cad; }
  .group { margin: 8px 18px 0; padding-top: 10px; border-top: 1px solid #e0e0e0; font-weight: 700; }
  .foot { position: absolute; right: 18px; bottom: 16px; display: flex; gap: 10px; }
  .foot button { font: 14px/1.5 'Microsoft YaHei', sans-serif; padding: 4px 22px; border: 1px solid #b0b0b0; border-radius: 3px; background: #f5f5f5; color: #1a1a1a; }
  .foot .primary { background: #0b5cad; border-color: #0b5cad; color: #fff; }
</style>
</head>
<body data-size="960x600">
  <div class="menu">
    <span data-block="0">文件</span>
    <span data-block="1">编辑</span>
    <span data-block="2">视图</span>
    <span data-block="3">工具</span>
    <span data-block="4">帮助</span>
  </div>
  <div class="tools">
    <button data-block="5">新建</button>
    <button data-block="6">打开</button>
    <button data-block="7">保存</button>
    <button data-block="8">另存为</button>
    <button data-block="9">撤销</button>
    <button data-block="10">重做</button>
    <button data-block="11">查找</button>
  </div>
  <div class="dialog">
    <div class="title" data-block="12">偏好设置</div>
    <div class="tabs">
      <span class="on" data-block="13">常规</span>
      <span data-block="14">外观</span>
      <span data-block="15">快捷键</span>
      <span data-block="16">高级</span>
    </div>
    <div class="row" style="margin-top: 14px">
      <span class="name" data-block="17">界面语言</span>
      <span class="field wide" data-block="18">简体中文</span>
    </div>
    <div class="row">
      <span class="name" data-block="19">自动保存间隔</span>
      <span class="field" data-block="20">5</span>
      <span data-block="21">分钟</span>
    </div>
    <div class="row">
      <span class="name" data-block="22">字体大小</span>
      <span class="field" data-block="23">14</span>
      <span data-block="24">像素</span>
    </div>
    <div class="check"><span class="box on"></span><span data-block="25">启动时检查更新</span></div>
    <div class="check"><span class="box on"></span><span data-block="26">关闭窗口时最小化到系统托盘</span></div>
    <div class="check"><span class="box"></span><span data-block="27">登录系统后自动启动</span></div>
    <div class="group" data-block="28">隐私</div>
    <div class="check"><span class="box"></span><span data-block="29">发送匿名使用统计</span></div>
    <div class="foot">
      <button class="primary" data-block="30">确定</button>
      <button data-block="31">取消</button>
      <button data-block="32">应用</button>
    </div>
  </div>
  <div class="status">
    <span data-block="33">就绪</span>
    <span data-block="34">未连接到服务器</span>
    <span data-block="35">行 3，列 12</span>
  </div>
</body>
</html>
