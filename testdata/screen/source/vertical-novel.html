<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>vertical-novel</title>
<style>
  html, body { margin: 0; }
  body { width: 640px; height: 520px; overflow: hidden; background: #f8f3e7; color: #24221e; font: 28px/1.8 'Microsoft JhengHei', sans-serif; }
  article { position: absolute; right: 92px; top: 60px; display: flex; flex-direction: row-reverse; }
  span { writing-mode: vertical-rl; text-orientation: upright; white-space: nowrap; }
</style>
<body data-size="640x520">
<article data-block="0"><span data-line>清晨的河邊總是很安靜。</span><span data-line>薄霧貼著水面慢慢散開。</span><span data-line>岸上的老人正在練太極。</span><span data-line>橋下的水流得很慢很慢。</span></article>
</body>
</html>
