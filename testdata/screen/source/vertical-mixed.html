<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>vertical-mixed</title>
<style>
  html, body { margin: 0; }
  body { width: 720px; height: 560px; overflow: hidden; background: #faf9f5; color: #222; font: 28px/1.8 'Microsoft JhengHei', sans-serif; }
  article { position: absolute; right: 100px; top: 48px; display: flex; flex-direction: row-reverse; }
  article span { writing-mode: vertical-rl; text-orientation: upright; white-space: nowrap; }
  p { position: absolute; left: 80px; top: 430px; margin: 0; font-size: 24px; }
</style>
<body data-size="720x560">
<article data-block="0"><span data-line>春天的風輕輕吹過山谷。</span><span data-line>遠方的村莊亮起了燈火。</span><span data-line>我們沿著小路慢慢回家。</span></article>
<p data-block="1">這是一段橫排的圖片說明。</p>
</body>
</html>
