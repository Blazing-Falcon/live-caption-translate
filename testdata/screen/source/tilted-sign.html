<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>tilted-sign</title>
<style>
  html, body { margin: 0; }
  body { width: 800px; height: 400px; overflow: hidden; background: #dbe3db; color: #fff; font: 36px/1.5 'Microsoft YaHei', sans-serif; }
  article { position: absolute; left: 160px; top: 140px; padding: 14px 26px; background: #23533a; transform: rotate(-15deg); }
  span { display: block; white-space: nowrap; }
</style>
<body data-size="800x400">
<article data-block="0"><span data-line>请沿河边步道向前走。</span></article>
</body>
</html>
