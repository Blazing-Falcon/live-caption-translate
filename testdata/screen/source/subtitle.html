<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>subtitle</title>
<style>
  html, body { margin: 0; }
  body {
    width: 1280px; height: 720px; overflow: hidden; position: relative;
    background:
      radial-gradient(ellipse at 18% 28%, rgba(255, 160, 90, 0.55), transparent 42%),
      radial-gradient(ellipse at 82% 22%, rgba(70, 110, 200, 0.5), transparent 48%),
      radial-gradient(ellipse at 50% 88%, rgba(200, 200, 190, 0.5), transparent 40%),
      linear-gradient(180deg, #1c2233 0%, #0f1117 55%, #2a1f1a 100%);
  }
  .lamp { position: absolute; left: 380px; top: 560px; width: 520px; height: 90px; background: rgba(230, 230, 215, 0.45); filter: blur(14px); }
  .pillar { position: absolute; left: 140px; top: 120px; width: 70px; height: 600px; background: rgba(0, 0, 0, 0.45); }
  .subtitle {
    position: absolute; left: 0; right: 0; top: 566px; text-align: center;
    color: #fff; font: 700 28px/1.35 'Microsoft YaHei', sans-serif;
    text-shadow:
      -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
      0 -2px 0 #000, 0 2px 0 #000, -2px 0 0 #000, 2px 0 0 #000,
      0 0 6px #000;
  }
</style>
</head>
<body data-size="1280x720">
  <div class="pillar"></div>
  <div class="lamp"></div>
  <div class="subtitle" data-block="0">你确定要这样做吗？<br>天亮之前，我们必须离开这里。</div>
</body>
</html>
