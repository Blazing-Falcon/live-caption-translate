[workspace]
resolver = "2"
members = ["crates/lt-core", "crates/lt-audio", "crates/lt-sherpa", "crates/lt-llm", "crates/lt-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
lt-core = { path = "crates/lt-core" }
lt-audio = { path = "crates/lt-audio" }
lt-sherpa = { path = "crates/lt-sherpa" }
lt-llm = { path = "crates/lt-llm" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
crossbeam-channel = "0.5"
toml = "0.9"
tracing = "0.1"
