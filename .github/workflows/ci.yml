name: check
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare pinned native libraries
        shell: python
        run: |
          import json, os, subprocess, sys
          result = subprocess.check_output([sys.executable, 'scripts/prepare-native-runtime.py', '--json'], text=True)
          runtime = json.loads(result)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('SHERPA_ONNX_LIB_DIR=' + runtime['lib_dir'] + '\n')
      - run: python scripts/test_prepare_native_runtime.py
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build and test the UI
        shell: pwsh
        run: |
          npm --prefix app/ui ci --no-audit --no-fund
          npm --prefix app/ui run check
          npm --prefix app/ui run lint:tokens
          npm --prefix app/ui test
          npm --prefix app/ui run build
          cd app/ui
          node node_modules/@playwright/test/cli.js install chromium
          npm run e2e
      # Installs the version pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --no-run
      - shell: pwsh
        run: ./scripts/install-native-runtime.ps1
      - run: cargo test --workspace --all-features
