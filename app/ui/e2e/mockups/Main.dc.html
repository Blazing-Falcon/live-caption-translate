<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overlay, subtitle bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E3A33B}a:hover{color:#F0BE6A}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #2A2C30; font-family: 'IBM Plex Sans', 'Noto Sans SC', sans-serif; color: #F4F4F2">
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
<div style="font-size: 15px; color: #8A8D93; letter-spacing: 0.02em">[Video or stream playing in any app]</div>
</div>

<div style="position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%); width: 960px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 16px 24px 18px; background: rgba(14,15,17,{{barAlpha}}); border-radius: 10px; outline: {{moveOutline}}; outline-offset: 6px">
<div style="display: flex; flex-direction: column; gap: 4px; opacity: 0.55">
<sc-if value="{{showSource}}" hint-placeholder-val="{{ true }}">
<div style="font-family: 'Noto Sans SC', sans-serif; font-size: 16px; line-height: 1.45; color: #C9CBCF">这波操作真的太秀了，我直接看傻了。</div>
</sc-if>
<div style="font-size: {{prevSize}}px; line-height: 1.3; font-weight: 500">This move is really amazing; I'm completely amazed.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-if value="{{showSource}}" hint-placeholder-val="{{ true }}">
<div style="font-family: 'Noto Sans SC', sans-serif; font-size: 17px; line-height: 1.45; color: #C9CBCF">大家好，欢迎来到我的直播间，今天我们继续打这个副本。</div>
</sc-if>
<div style="font-size: {{textSize}}px; line-height: 1.3; font-weight: 500">Hello everyone, welcome to my live stream. Today, we continue<span style="display: inline-block; width: 2px; height: 0.95em; margin-left: 4px; vertical-align: -0.1em; background: #E3A33B"></span></div>
</div>
</div>

<sc-if value="{{isMove}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 50%; bottom: 248px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 14px; background: #111214; border-radius: 8px; font-size: 13px; color: #D5D7DB">
<span>Move or resize, then lock</span>
<span style="font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; padding: 2px 6px; border: 1px solid #45484E; border-radius: 4px; color: #B4B7BC">Ctrl Shift L</span>
<button type="button" style="font: inherit; font-size: 13px; font-weight: 500; padding: 6px 12px; min-height: 32px; border: 0; border-radius: 6px; background: #E3A33B; color: #1A1B1D; cursor: pointer">Lock</button>
</div>
</sc-if>

<div style="position: absolute; top: 20px; right: 24px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: rgba(14,15,17,0.7); border-radius: 6px; font-size: 12px; color: #B4B7BC">
<span style="width: 7px; height: 7px; border-radius: 50%; background: #E3A33B"></span>
<span>Listening · system audio</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["Locked (click-through)","Move"],"default":"Locked (click-through)"},"showSource":{"editor":"boolean","default":true},"textSize":{"editor":"range","min":18,"max":40,"step":1,"unit":"px","default":26},"barOpacity":{"editor":"range","min":0,"max":100,"step":5,"unit":"%","default":82},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const mode = this.props.mode ?? 'Locked (click-through)';
const isMove = mode === 'Move';
const textSize = this.props.textSize ?? 26;
const op = this.props.barOpacity ?? 82;
return {
isMove,
showSource: this.props.showSource ?? true,
textSize,
prevSize: Math.round(textSize * 0.8),
barAlpha: (op / 100).toFixed(2),
moveOutline: isMove ? '1.5px dashed #E3A33B' : 'none'
};
}
}
</script>
</body>
</html>
