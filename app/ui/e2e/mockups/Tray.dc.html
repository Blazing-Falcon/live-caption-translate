<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tray menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5A12}a:hover{color:#6B4409}
</style>
</helmet>
<div style="width: 520px; height: 480px; box-sizing: border-box; padding: 40px; background: #DADAD5; font-family: 'IBM Plex Sans', sans-serif; color: #1B1C1E; display: flex; align-items: flex-end; justify-content: flex-end">
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 10px">
<div style="width: 280px; display: flex; flex-direction: column; padding: 6px; background: #FBFBF9; border: 1px solid #D0D0CB; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.12)">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 10px 12px">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #B27318"></span>
<div style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 14px; font-weight: 500">Listening</span>
<span style="font-size: 12px; color: #6B6E73">System audio · 1.8 s behind</span>
</div>
</div>
<div style="height: 1px; background: #E8E8E3; margin: 0 4px 4px"></div>
<button type="button" style="font: inherit; font-size: 14px; text-align: left; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; height: 36px; border: 0; border-radius: 5px; background: #ECECE7; color: #1B1C1E; cursor: pointer"><span>Pause</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6B6E73">Ctrl Shift P</span></button>
<button type="button" style="font: inherit; font-size: 14px; text-align: left; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; height: 36px; border: 0; border-radius: 5px; background: transparent; color: #1B1C1E; cursor: pointer"><span>Hide overlay</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6B6E73">Ctrl Shift H</span></button>
<button type="button" style="font: inherit; font-size: 14px; text-align: left; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; height: 36px; border: 0; border-radius: 5px; background: transparent; color: #1B1C1E; cursor: pointer"><span>Move overlay</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6B6E73">Ctrl Shift L</span></button>
<div style="height: 1px; background: #E8E8E3; margin: 4px"></div>
<button type="button" style="font: inherit; font-size: 14px; text-align: left; padding: 0 10px; height: 36px; border: 0; border-radius: 5px; background: transparent; color: #1B1C1E; cursor: pointer">Listen to: Whole system</button>
<button type="button" style="font: inherit; font-size: 14px; text-align: left; padding: 0 10px; height: 36px; border: 0; border-radius: 5px; background: transparent; color: #1B1C1E; cursor: pointer">Open transcript folder</button>
<button type="button" style="font: inherit; font-size: 14px; text-align: left; padding: 0 10px; height: 36px; border: 0; border-radius: 5px; background: transparent; color: #1B1C1E; cursor: pointer">Settings…</button>
<div style="height: 1px; background: #E8E8E3; margin: 4px"></div>
<button type="button" style="font: inherit; font-size: 14px; text-align: left; padding: 0 10px; height: 36px; border: 0; border-radius: 5px; background: transparent; color: #1B1C1E; cursor: pointer">Quit</button>
</div>
<div style="font-size: 12px; color: #55585D">[taskbar tray icon]</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":480}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
