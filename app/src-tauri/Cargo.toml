[package]
name = "live-translation"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline live captions with English translation"
default-run = "live-translation"

[lib]
name = "live_translation_lib"
path = "src/lib.rs"

[[bin]]
name = "live-translation"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
lt-core.workspace = true
lt-audio.workspace = true
lt-sherpa.workspace = true
lt-llm.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
num_cpus = "1.17"
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com",
] }
