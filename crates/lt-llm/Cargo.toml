[package]
name = "lt-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lt-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
sha2 = "0.10"
# The translator supplies its own cancellable loopback transport. Separate
# model-download agents can use the regular TLS/proxy-aware connector.
ureq = { version = "~3.4.2", default-features = false, features = ["json", "rustls", "win-system-proxy"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
