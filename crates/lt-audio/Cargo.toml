[package]
name = "lt-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lt-core.workspace = true
hound = "3.5.1"
rubato = { version = "5.0.1", default-features = false, features = ["fft_resampler"] }
tracing.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
rtrb = "0.4.0"
wasapi = "0.25.0"
windows-core = "0.62.2"
png = "0.18"
base64 = "0.22"
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation", "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio", "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming", "Win32_Media_Multimedia",
    "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant", "Win32_System_Threading",
    "Win32_System_Performance", "Win32_Security",
    "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
] }
windows-sys = { version = "0.61.2", default-features = false, features = [
    "Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
