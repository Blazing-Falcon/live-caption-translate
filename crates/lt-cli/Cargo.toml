[package]
name = "lt-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
sherpa = ["dep:lt-sherpa"]
llm = ["dep:lt-llm"]
ocr = ["sherpa", "llm", "dep:lt-ocr", "dep:png"]

[dependencies]
# `--fake` replay runs the deterministic engines, so this is not test-only.
lt-core = { workspace = true, features = ["fakes"] }
lt-audio.workspace = true
lt-sherpa = { workspace = true, optional = true }
lt-llm = { workspace = true, optional = true }
lt-ocr = { workspace = true, optional = true }
png = { version = "0.18", optional = true }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hound = "3.5"
crossbeam-channel.workspace = true
ctrlc = { version = "3", features = ["termination"] }
